packages:
  - llumiverse/common
  - packages/*
  - libraries/*
  - libraries/koa-stack/*
  - templates/*
  - "!templates/worker-template"
verifyDepsBeforeRun: false
allowBuilds:
  '@firebase/util': true
  '@swc/core': true
  esbuild: true
  protobufjs: true
  sharp: true
  unrs-resolver: true
blockExoticSubdeps: true
minimumReleaseAge: 4320 # 3 days in minutes, minimumReleaseAge protects against supply chain attacks.
minimumReleaseAgeStrict: true
minimumReleaseAgeExclude:
  - "@vertesia/*"
  - "@llumiverse/*"
  # Renovate security update: js-yaml@5.2.2
  - js-yaml@5.2.2
  - js-yaml@4.3.1
  - mermaid@11.16.1
  # GHSA-mh99-v99m-4gvg backport to the 2.x line, published 2026-07-30. Version-scoped exception
  # so we take the fix now rather than waiting out the 3-day cooldown.
  - brace-expansion@2.1.4
  # GHSA-8j4g-w8fx-2239 (ReDoS in CORS middleware) fix, published 2026-08-03. Version-scoped
  # exception so we take the fix now rather than waiting out the 3-day cooldown.
  - hono@4.12.34
  # Renovate security update: dompurify@3.4.13
  - dompurify@3.4.13
catalog:
  typescript: "7.0.2"
  typescript-legacy: "npm:typescript@6.0.3"
  react: "19.2.8"
  react-dom: "19.2.8"
  "@types/node": "^24.13.3"
  "@types/react": "19.2.18"
  "@types/react-dom": "19.2.5"
  vite: "8.2.2"
  rolldown: "1.2.6"
overrides:
  # ============================
  # Special Overrides
  # ============================
  # We have these for more than simple CVE fixes, but may also do that. Or have complex requirements to track.
  # There must only be 1 react
  react: "catalog:"
  react-dom: "catalog:"
  "@types/node": "catalog:"
  "@types/react": "catalog:"
  "@types/react-dom": "catalog:"

  # Safety net: if a transitive dep ever pulls in koa 2, force it to 3.
  # Packages directly declare koa@^3.2.0 — this guards against regressions.
  "koa@<3.2.1": "^3.2.1"
  "@types/koa@<3.0.3": "^3.0.3"

  # Pin single vite
  vite: "catalog:"

  # ============================
  # Standard CVE overrides
  # ============================
  "@ungap/structured-clone@<=1.3.0": ^1.3.1 #CWE-502 and package deprecation, won't show as CVE.
  "@hono/node-server@<2.0.5": 2.0.10
  # GHSA-c83g-rgw3-j3cx + GHSA-73wf-gq98-2v4g (unbounded query cache and unsafe custom stats).
  "browserslist@<4.28.7": 4.28.8
  # GHSA-8j4g-w8fx-2239 (ReDoS in CORS middleware). Floor so a transitive consumer can never
  # resolve back to a vulnerable version. 4.12.34 needs the minimumReleaseAgeExclude entry above.
  "hono@<4.12.34": 4.12.34
  # GHSA-mh99-v99m-4gvg. Each major line is floored on its own backport rather than forced to
  # 5.0.8, which would be a cross-major jump for its consumers (mocha, @hono/vite-dev-server).
  # 2.1.4 needs the minimumReleaseAgeExclude entry above. Note the advisory still declares
  # `>=5.0.8` as its only patched range, so `pnpm audit` may keep reporting the 2.x copy until
  # GHSA re-scopes it — 2.1.4 does carry the fix (EXPANSION_MAX_LENGTH, CVE-2026-14257).
  "brace-expansion@>=2.0.0 <2.1.4": 2.1.4
  "brace-expansion@>=3.0.0 <5.0.9": 5.0.9
  diff@>=6.0.0 <8.0.3: ^8.0.3
  dompurify@<=3.4.12: ^3.4.13
  # GHSA-7p8r-x3mc-p8w7, GHSA-5jgf-p345-68v8, GHSA-f65p-4m7j-42xc,
  # GHSA-fph4-wmhf-6fwf, and GHSA-jqff-g426-hqxp (host-confusion and SSRF flaws).
  "fast-uri@>=3.0.0 <3.1.6": 3.1.6
  # Tilde (not caret) so @firebase/firestore stays on its ~1.9 line and @temporalio/* on 1.14.
  "@grpc/grpc-js@<1.9.16": ~1.9.16
  "@grpc/grpc-js@>=1.14.0 <1.14.4": ~1.14.4
  form-data@>=4.0.0 <4.0.6: ^4.0.6
  # GHSA-fxqj-rqcc-2cmp: incomplete fix of GHSA-6g55-p6wh-862q (attacker-controlled
  # sourceMappingURL reads arbitrary .map files when `from` is unset).
  postcss@<8.5.23: 8.5.23
  "js-yaml@>=4.0.0 <4.3.1": 4.3.1
  # GHSA-pm4m-ph32-ghv5 (5.x line, reached via packages/build-tools). This lockfile already
  # resolves 5.2.2; the floor pins that in place so a future resolution cannot drop back to a
  # vulnerable 5.x. Major-scoped on purpose — a bare `js-yaml@<5.2.2` would drag the 4.x
  # consumers above across a major.
  "js-yaml@>=5.0.0 <5.2.2": 5.2.2
  # GHSA-2v37-7h3g-55p8: zero-sized custom generators can loop indefinitely.
  # PostCSS remains on nanoid 3; only vulnerable releases are redirected to the latest 3.x patch.
  "nanoid@<3.3.17": 3.3.18
  protobufjs@<=7.6.4: 7.6.5
  # GHSA-x5fp-wj9c-mxmx and GHSA-4mjr-xmp4-gh2g (resource exhaustion and DoS).
  "qs@<6.16.0": 6.16.0
  serialize-javascript@<=7.0.2: ^7.0.3
  serialize-javascript@>=5.0.0 <7.0.5: ^7.0.5
  shell-quote@<=1.8.4: 1.9.0
