name: (publish) NPM koa-stack packages

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: Release Type
        required: true
        type: choice
        options: [snapshot, release]
        default: snapshot
      bump_type:
        description: Version Bump
        required: true
        type: choice
        options: [keep, patch, minor]
        default: keep
      dry_run:
        description: Dry Run
        required: true
        type: boolean
        default: true

concurrency:
  group: publish-koa-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Publish Koa cohort
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: build
    permissions:
      id-token: write # required for npm trusted publishing
      contents: read # required to check out the release source
    outputs:
      version: ${{ steps.publish.outputs.version }}
      npm_tag: ${{ steps.publish.outputs.npm_tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - name: Resolve pnpm store directory
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "${GITHUB_OUTPUT}"
      - name: Restore pnpm store cache
        id: pnpm-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-${{ runner.arch }}-
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
      - name: Install workspace dependencies
        run: pnpm install
      - name: Save pnpm store cache
        if: steps.pnpm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ steps.pnpm-cache.outputs.cache-primary-key }}
      - name: Test package channel policy
        run: bash ./.github/bin/lib-package-channel.test.sh
      - name: Publish Koa packages
        id: publish
        env:
          RELEASE_TYPE: ${{ inputs.release_type }}
          BUMP_TYPE: ${{ inputs.bump_type }}
          DRY_RUN: ${{ inputs.dry_run }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        run: |
          deploy_key_path="${RUNNER_TEMP}/publish-deploy-key"
          umask 077
          printf '%s\n' "${DEPLOY_KEY}" > "${deploy_key_path}"
          unset DEPLOY_KEY
          trap 'rm -f "${deploy_key_path}"' EXIT
          export GIT_SSH_COMMAND="ssh -i ${deploy_key_path} -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git remote set-url origin git@github.com:vertesia/composableai.git
          ./.github/bin/publish-koa-packages.sh \
              --ref "${GITHUB_REF_NAME}" \
              --release-type "${RELEASE_TYPE}" \
              --bump-type "${BUMP_TYPE}" \
              --dry-run "${DRY_RUN}"

  verify:
    name: Verify published Koa cohort
    needs: publish
    if: inputs.dry_run == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
      - name: Verify exact published cohort
        env:
          VERSION: ${{ needs.publish.outputs.version }}
          NPM_TAG: ${{ needs.publish.outputs.npm_tag }}
        run: |
          for attempt in 1 2 3 4 5; do
            missing=false
            for package in body router server; do
              exact="$(npm view "@koa-stack/${package}@${VERSION}" version 2>/dev/null || true)"
              tagged="$(npm view "@koa-stack/${package}@${NPM_TAG}" version 2>/dev/null || true)"
              [ "$exact" = "$VERSION" ] && [ "$tagged" = "$VERSION" ] || missing=true
            done
            [ "$missing" = false ] && exit 0
            [ "$attempt" -eq 5 ] && break
            sleep $((attempt * 15))
          done
          echo "Koa-stack cohort ${VERSION} did not become readable from npm" >&2
          exit 1
