name: (test) Build and test

on:
  push:
    branches:
      - main
      - "release/**"
      - "production/**"
      - "hotfix**"
      - "repo-dispatch**"
  pull_request:
    types: [opened, reopened, synchronize]

env:
  COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

# Cancel superseded runs on the same branch (latest push wins). Each branch
# still gets its own concurrent run, so main/release/PR pushes don't block
# each other.
concurrency:
  group: composable-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ env.COMMIT_SHA }}
          submodules: true
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Locate pnpm store
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "${GITHUB_OUTPUT}"
      - name: Restore pnpm store cache
        id: pnpm-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-${{ runner.arch }}-
      - name: Install pandoc
        uses: pandoc/actions/setup@86321b6dd4675f5014c611e05088e10d4939e09e # v1.1.1
      - name: Install native test dependencies
        # The runner's Azure mirror repeatedly exhausted the install timeout before tests ran.
        # Use Ubuntu's primary HTTPS archive, while keeping the installation bounded.
        # `update` only refreshes lists the runner image already ships, so a stalled refresh falls
        # through to install rather than failing.
        #
        # Keep a single install process: killing apt-get can leave its dpkg child holding the lock,
        # which makes an immediate retry fail. Allow a slow mirror to finish the package download.
        timeout-minutes: 12
        run: |
          for source in /etc/apt/sources.list /etc/apt/sources.list.d/*.sources /etc/apt/sources.list.d/*.list /etc/apt/apt-mirrors*.txt; do
            if [[ -f "$source" ]]; then
              sudo sed -i 's|https\?://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' "$source"
            fi
          done
          APT_ACQUIRE="-o Acquire::Retries=3 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15"
          sudo timeout 90 apt-get update $APT_ACQUIRE ||
            echo "apt-get update timed out or failed; continuing with the runner image's lists"
          sudo timeout 600 apt-get install -y $APT_ACQUIRE imagemagick mupdf-tools
        shell: bash
      - name: Install workspace dependencies
        timeout-minutes: 5
        run: pnpm install
      - name: Pre-download Temporal test server binaries
        # The Temporal tests download the server binaries in their `beforeAll` hooks, where a dropped transfer
        # fails the suite. Fetch them once here instead, retrying a failed attempt: the tests then find them in
        # the SDK's default download directory. A killed attempt leaves `<binary>.downloading` behind, which
        # the SDK takes for another process's download and waits on, so a retry deletes it first.
        timeout-minutes: 4
        working-directory: packages/workflow
        run: |
          prewarm() {
            timeout --kill-after=5 60 node --input-type=module -e "
              import testing from '@temporalio/testing';
              for (const create of ['createTimeSkipping', 'createLocal']) {
                await (await testing.TestWorkflowEnvironment[create]()).teardown();
              }"
          }
          tmp=$(node -p "require('node:os').tmpdir()")
          for attempt in 1 2 3; do
            prewarm && exit 0
            echo "::warning::Temporal binary download failed (attempt $attempt of 3)"
            rm -f "$tmp"/temporal-*.downloading
            sleep $((attempt * 5))
          done
          exit 1
      - name: Save pnpm store cache
        if: github.event_name == 'push' && steps.pnpm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ steps.pnpm-cache.outputs.cache-primary-key }}
      - name: Build workspace
        timeout-minutes: 10
        run: pnpm build
      - name: Typecheck and run package tests
        timeout-minutes: 10
        run: pnpm ci:test

  template-smoke-test:
    name: Template smoke test (Plugin)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ env.COMMIT_SHA }}
          submodules: true
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Locate pnpm store
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "${GITHUB_OUTPUT}"
      - name: Restore pnpm store cache
        id: pnpm-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-${{ runner.arch }}-
      - name: Install workspace dependencies
        timeout-minutes: 5
        run: pnpm install
      - name: Save pnpm store cache
        if: github.event_name == 'push' && steps.pnpm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ steps.pnpm-cache.outputs.cache-primary-key }}
      - name: Build workspace
        timeout-minutes: 10
        run: pnpm build
      - name: Test package channel policy
        run: bash ./.github/bin/lib-package-channel.test.sh
      - name: Template integration test - Plugin
        timeout-minutes: 10
        run: ./.github/bin/test-template-integration.sh --release-type snapshot --template "Vertesia Plugin"

  notify-repo-studio:
    name: Notify vertesia/studio of new commit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/') || startsWith(github.ref, 'refs/heads/repo-dispatch'))
    needs:
      - unit-tests
      - template-smoke-test
    # Scopes the submodule-sync App key to a dedicated environment.
    environment: submodule-sync
    steps:
      - name: Generate Studio dispatch token
        id: studio-dispatch-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.APP_VERTESIA_SUBMODULE_SYNC_CLIENT_ID }}
          private-key: ${{ secrets.APP_VERTESIA_SUBMODULE_SYNC_PEM }}
          owner: ${{ github.repository_owner }}
          repositories: studio
          permission-contents: write

      - name: Notify repository vertesia/studio
        env:
          GH_TOKEN: ${{ steps.studio-dispatch-token.outputs.token }}
          COMPOSABLEAI_SHA: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
          SENDER: ${{ github.actor }}
        run: |
          gh api repos/vertesia/studio/dispatches \
            --method POST \
            --input - <<EOF
          $(jq -nc \
              --arg sha "${COMPOSABLEAI_SHA}" \
              --arg branch "${BRANCH}" \
              --arg sender "${SENDER}" \
              '{event_type: "update-git-submodule-request", client_payload: {composableai_sha: $sha, branch: $branch, sender: $sender}}')
          EOF
