name: (publish) NPM packages

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: Release Type
        required: true
        type: choice
        options:
          - snapshot
          - release
        default: snapshot
      bump_type:
        description: Version Bump
        required: true
        type: choice
        options:
          - keep
          - patch
          - minor
        default: keep
      dry_run:
        description: Dry Run
        required: true
        type: boolean
        default: true

# Serialize publish runs so two concurrent dispatches don't race on the
# shared npm registry or push competing version bumps.
concurrency:
  group: publish-npm-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare-release:
    name: Prepare release version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Calculate package version
        id: version
        shell: bash
        env:
          RELEASE_TYPE: ${{ inputs.release_type }}
          BUMP_TYPE: ${{ inputs.bump_type }}
        run: |
          current_version="$(node -p "require('./package.json').version")"
          base_version="${current_version%%-dev*}"
          IFS='.' read -r major minor patch <<< "${base_version}"
          case "${BUMP_TYPE}" in
              minor) base_version="${major}.$((minor + 1)).0" ;;
              patch) base_version="${major}.${minor}.$((patch + 1))" ;;
          esac
          if [ "${RELEASE_TYPE}" = "snapshot" ]; then
              version="${base_version}-dev.$(date -u +'%Y%m%d.%H%M%SZ')"
          else
              version="${base_version}"
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

  build-macos-cli:
    name: Build and sign macOS CLI
    runs-on: macos-14
    timeout-minutes: 20
    needs: prepare-release
    environment: build
    permissions:
      contents: read # required to check out the release source
      id-token: write # required for GCP workload identity federation
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - name: Resolve pnpm store directory
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "${GITHUB_OUTPUT}"
      - name: Restore pnpm store cache
        id: pnpm-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-${{ runner.arch }}-
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Install workspace dependencies
        timeout-minutes: 5
        run: pnpm install
      - name: Save pnpm store cache
        if: steps.pnpm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ steps.pnpm-cache.outputs.cache-primary-key }}
      - name: Align package versions
        env:
          CLI_VERSION: ${{ needs.prepare-release.outputs.version }}
        run: |
          npm version "${CLI_VERSION}" --no-git-tag-version --workspaces=false
          pnpm -r --filter "./packages/**" --filter "./libraries/jst" \
              exec npm version "${CLI_VERSION}" --no-git-tag-version
      - name: Build CLI workspace dependencies
        run: pnpm exec turbo run build --filter=@vertesia/cli...

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: projects/265888598630/locations/global/workloadIdentityPools/composable-cloud/providers/github
          service_account: cli-release-publisher@dengenlabs.iam.gserviceaccount.com
      - name: Install Google Cloud CLI
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Load Apple signing identity
        shell: bash
        run: |
          gcloud secrets versions access latest \
              --project=dengenlabs \
              --secret=apple-developer-id-application-p12 \
              --out-file="${RUNNER_TEMP}/vertesia-developer-id.p12"
          gcloud secrets versions access latest \
              --project=dengenlabs \
              --secret=apple-developer-id-application-p12-password \
              --out-file="${RUNNER_TEMP}/vertesia-developer-id.p12.password"

          keychain_path="${RUNNER_TEMP}/vertesia-signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          p12_password="$(<"${RUNNER_TEMP}/vertesia-developer-id.p12.password")"

          curl --fail --silent --show-error --location \
              https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer \
              --output "${RUNNER_TEMP}/DeveloperIDG2CA.cer"
          intermediate_sha256="$(shasum -a 256 "${RUNNER_TEMP}/DeveloperIDG2CA.cer" | cut -d' ' -f1)"
          test "${intermediate_sha256}" = "f16cd3c54c7f83cea4bf1a3e6a0819c8aaa8e4a1528fd144715f350643d2df3a"

          security create-keychain -p "${keychain_password}" "${keychain_path}"
          security set-keychain-settings -lut 21600 "${keychain_path}"
          security unlock-keychain -p "${keychain_password}" "${keychain_path}"
          security import "${RUNNER_TEMP}/DeveloperIDG2CA.cer" \
              -k "${keychain_path}" \
              -T /usr/bin/codesign
          security import "${RUNNER_TEMP}/vertesia-developer-id.p12" \
              -k "${keychain_path}" \
              -P "${p12_password}" \
              -T /usr/bin/codesign
          security set-key-partition-list \
              -S apple-tool:,apple:,codesign: \
              -s \
              -k "${keychain_password}" \
              "${keychain_path}"
          security list-keychains -d user -s "${keychain_path}"
          security find-identity -v -p codesigning "${keychain_path}"

      - name: Build and sign macOS executables
        working-directory: packages/cli
        shell: bash
        env:
          CLI_VERSION: ${{ needs.prepare-release.outputs.version }}
        run: |
          pnpm run build:native:macos
          signing_identity='Developer ID Application: Vertesia, Inc. (658WNHC6ZU)'
          sign_binary() {
              local binary="$1"
              local attempt
              for attempt in 1 2 3; do
                  if codesign \
                      --force \
                      --identifier com.vertesia.cli \
                      --options runtime \
                      --timestamp \
                      --entitlements macos-entitlements.plist \
                      --sign "${signing_identity}" \
                      "${binary}"; then
                      return 0
                  fi
                  if [ "${attempt}" -eq 3 ]; then
                      return 1
                  fi
                  sleep 5
              done
          }
          for binary in ../cli-darwin-arm64/bin/vertesia ../cli-darwin-x64/bin/vertesia; do
              sign_binary "${binary}"
              codesign --verify --strict --verbose=2 "${binary}"
          done
          if [ "$(uname -m)" = "arm64" ]; then
              actual_version="$(../cli-darwin-arm64/bin/vertesia --version)"
              expected_runtime="native darwin-arm64"
          else
              actual_version="$(../cli-darwin-x64/bin/vertesia --version)"
              expected_runtime="native darwin-x64"
          fi
          test "${actual_version}" = "${CLI_VERSION} (${expected_runtime})"

      - name: Smoke test packed macOS CLI
        env:
          CLI_NATIVE_PACKAGE_ONLY: "true"
          CLI_VERIFY_CODE_SIGNATURE: "true"
        run: node packages/cli/scripts/smoke-native-package.mjs

      - name: Install and smoke test macOS CLI through Verdaccio
        if: inputs.dry_run == true
        timeout-minutes: 10
        env:
          CLI_VERIFY_CODE_SIGNATURE: "true"
          RELEASE_TYPE: ${{ inputs.release_type }}
        run: >-
          ./.github/bin/test-template-integration.sh
          --release-type "${RELEASE_TYPE}"
          --branch "${GITHUB_REF_NAME}"
          --cli-only

      - name: Upload signed CLI executables
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-cli-darwin
          path: |
            packages/cli-darwin-arm64/bin/vertesia
            packages/cli-darwin-x64/bin/vertesia
          if-no-files-found: error

      - name: Remove signing material from runner
        if: always()
        shell: bash
        run: |
          security delete-keychain "${RUNNER_TEMP}/vertesia-signing.keychain-db" 2>/dev/null || true
          rm -f \
              "${RUNNER_TEMP}/DeveloperIDG2CA.cer" \
              "${RUNNER_TEMP}/vertesia-developer-id.p12" \
              "${RUNNER_TEMP}/vertesia-developer-id.p12.password"

  publish:
    name: Publish all packages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - prepare-release
      - build-macos-cli
    # Scopes DEPLOY_KEY (used to push version bumps past branch protection)
    # to a dedicated environment.
    environment: build
    permissions:
      id-token: write # required for OIDC between GitHub and NPM
      contents: read # required to check out the release source
    outputs:
      version: ${{ steps.publish.outputs.version }}
      npm_tag: ${{ steps.publish.outputs.npm_tag }}
      publish_status: ${{ steps.publish.outputs.publish_status }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - name: Resolve pnpm store directory
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "${GITHUB_OUTPUT}"
      - name: Restore pnpm store cache
        id: pnpm-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-${{ runner.arch }}-
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      # Node.js 24 ships with npm 11.5.1 or later, as required for trusted publishing.
      - name: Verify npm version
        run: npm --version

      - name: Test package channel policy
        run: bash ./.github/bin/lib-package-channel.test.sh

      - name: Install workspace dependencies
        timeout-minutes: 5
        run: pnpm install
      - name: Save pnpm store cache
        if: steps.pnpm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ steps.pnpm-cache.outputs.cache-primary-key }}

      - name: Download signed macOS CLI executables
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: native-cli-darwin
          path: packages
      - name: Mark macOS CLI executables as executable
        run: >-
          chmod 755
          packages/cli-darwin-arm64/bin/vertesia
          packages/cli-darwin-x64/bin/vertesia

      - name: Publish all packages
        id: publish
        timeout-minutes: 5
        env:
          RELEASE_TYPE: ${{ inputs.release_type }}
          BUMP_TYPE: ${{ inputs.bump_type }}
          DRY_RUN: ${{ inputs.dry_run }}
          VERSION_OVERRIDE: ${{ needs.prepare-release.outputs.version }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        run: |
          deploy_key_path="${RUNNER_TEMP}/publish-deploy-key"
          umask 077
          printf '%s\n' "${DEPLOY_KEY}" > "${deploy_key_path}"
          unset DEPLOY_KEY
          trap 'rm -f "${deploy_key_path}"' EXIT
          export GIT_SSH_COMMAND="ssh -i ${deploy_key_path} -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git remote set-url origin git@github.com:vertesia/composableai.git
          ./.github/bin/publish-all-packages.sh \
              --ref "${GITHUB_REF_NAME}" \
              --release-type "${RELEASE_TYPE}" \
              --bump-type "${BUMP_TYPE}" \
              --dry-run "${DRY_RUN}"

      # Template integration tests using local verdaccio registry (dry-run only)
      - name: Template integration test - Plugin
        if: inputs.dry_run == true
        timeout-minutes: 10
        env:
          RELEASE_TYPE: ${{ inputs.release_type }}
        run: >-
          ./.github/bin/test-template-integration.sh
          --release-type "${RELEASE_TYPE}"
          --template "Vertesia Plugin"
          --branch "${GITHUB_REF_NAME}"

      - name: CLI integration test
        if: inputs.dry_run == true
        timeout-minutes: 10
        env:
          RELEASE_TYPE: ${{ inputs.release_type }}
        run: >-
          ./.github/bin/test-template-integration.sh
          --release-type "${RELEASE_TYPE}"
          --branch "${GITHUB_REF_NAME}"
          --cli-only

  # npm publish-time scanning can keep a successful publish unavailable for
  # 15 minutes or more. Wait on an inexpensive runner before starting either
  # integration test, especially the macOS runner.
  wait-for-npm:
    name: Wait for published npm packages
    runs-on: ubuntu-slim
    timeout-minutes: 10
    needs: publish
    if: inputs.dry_run == false
    steps:
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Wait for published CLI dependency closure
        env:
          PACKAGE_VERSION: ${{ needs.publish.outputs.version }}
        run: |
          packages=(
              @vertesia/api-fetch-client
              @vertesia/client
              @vertesia/common
              @vertesia/workflow
              @vertesia/cli-darwin-arm64
              @vertesia/cli-darwin-x64
              @vertesia/cli
          )
          for attempt in $(seq 1 31); do
              unavailable=()
              for package in "${packages[@]}"; do
                  if ! npm view "${package}@${PACKAGE_VERSION}" version --prefer-online >/dev/null 2>&1; then
                      unavailable+=("${package}")
                  fi
              done
              if [ "${#unavailable[@]}" -eq 0 ]; then
                  echo "Published CLI dependency closure is available at version ${PACKAGE_VERSION}"
                  exit 0
              fi
              if [ "${attempt}" -eq 31 ]; then
                  echo "Packages still unavailable after 15 minutes: ${unavailable[*]}" >&2
                  exit 1
              fi
              echo "Attempt ${attempt}/31: waiting for ${unavailable[*]}"
              sleep 30
          done

  # ============================================================
  # macOS CLI integration test after a real publish installs from npm.
  # ============================================================

  macos-cli-integration-test:
    name: Integration test (published macOS CLI)
    runs-on: macos-14
    timeout-minutes: 10
    needs:
      - publish
      - wait-for-npm
    if: inputs.dry_run == false
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install and smoke test published CLI
        env:
          CLI_PACKAGE_SPEC: "@vertesia/cli@${{ needs.publish.outputs.version }}"
          CLI_VERIFY_CODE_SIGNATURE: "true"
          CLI_VERSION: ${{ needs.publish.outputs.version }}
        run: node packages/cli/scripts/smoke-native-package.mjs

  integration-test:
    name: Integration test (published packages)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - publish
      - wait-for-npm
    if: inputs.dry_run == false
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - name: Resolve pnpm store directory
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "${GITHUB_OUTPUT}"
      - name: Restore pnpm store cache
        id: pnpm-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-${{ runner.arch }}-
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install and smoke test published CLI fallback
        env:
          CLI_PACKAGE_SPEC: "@vertesia/cli@${{ needs.publish.outputs.version }}"
          CLI_VERSION: ${{ needs.publish.outputs.version }}
        run: node packages/cli/scripts/smoke-native-package.mjs

      - name: Smoke test - Plugin
        timeout-minutes: 10
        env:
          RELEASE_TYPE: ${{ inputs.release_type }}
          PACKAGE_VERSION: ${{ needs.publish.outputs.version }}
        run: >-
          ./.github/bin/test-template-smoke.sh
          --release-type "${RELEASE_TYPE}"
          --template "Vertesia Plugin"
          --branch "${GITHUB_REF_NAME}"
          --package-version "${PACKAGE_VERSION}"
          --wait
      - name: Save pnpm store cache
        if: steps.pnpm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ steps.pnpm-cache.outputs.cache-primary-key }}
