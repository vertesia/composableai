<!-- App-owned first paint: no React, external stylesheets, or JavaScript bundle required. -->
<main class="app-boot" role="status" aria-live="polite">
    <h1 data-boot-title>Welcome</h1>
    <span class="app-boot-progress" aria-hidden="true"></span>
    <p>Loading your workspace…</p>
    <div id="loading-slow-notice" style="display: none;">
        <p>This is taking longer than usual.</p>
        <div id="loading-slow-reload" style="display: none;">
            <button type="button" data-boot-reload>Reload page</button>
        </div>
    </div>
</main>
